name: Bot tín hiệu (Telegram)

on:
  schedule:
  - cron: "4,34 * * * *"  # mỗi job tự quét lặp 5 phút/lần trong ~50 phút; GitHub hay trễ lịch nên đặt 2 lần/giờ
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "bot-tin-hieu/ict.js"
      - ".github/workflows/bot-tin-hieu.yml"

permissions:
  contents: write

concurrency:
  group: bot-tin-hieu
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lấy nhật ký cũ (nhánh bot-data)
        run: |
          mkdir -p botdata
          if git fetch -q --depth=1 origin bot-data; then
            git show FETCH_HEAD:state.json > botdata/state.json 2>/dev/null || true
            git show FETCH_HEAD:signals.json > botdata/signals.json 2>/dev/null || true
          fi

      - name: Quét tín hiệu (lặp 5 phút/lần) + gửi Telegram + lưu nhật ký
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          TFS: ${{ vars.TFS }}
          RR: ${{ vars.RR }}
          MIN_GRADE: ${{ vars.MIN_GRADE }}
          HTF_EMA: ${{ vars.HTF_EMA }}
          ALIGN: ${{ vars.ALIGN }}
          TV_XAU: ${{ vars.TV_XAU }}
          TV_BTC: ${{ vars.TV_BTC }}
          DATA_DIR: botdata
          LOOP_MIN: 50
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scanner/loop.sh
