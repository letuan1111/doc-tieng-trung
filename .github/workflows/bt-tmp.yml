name: Nghiên cứu tạm (bt-ict)
on:
  push:
    branches: [bt-ict]
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node research/fetch.mjs 190
      - uses: actions/upload-artifact@v4
        with:
          name: okx-data
          path: research/data/
          retention-days: 7
