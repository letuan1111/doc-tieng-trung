name: Nghiên cứu tạm (bt-ict)
on:
  push:
    branches: [bt-ict]
permissions:
  contents: write
jobs:
  data:
    if: "!contains(github.event.head_commit.message, '[data]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node research/fetch.mjs 375
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/data
          git commit -q -m "[data] dữ liệu OKX 375 ngày"
          git push -q origin HEAD:bt-ict
