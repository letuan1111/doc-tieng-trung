name: Đồng bộ gh-pages + build Pages

# Trang web được phục vụ từ nhánh gh-pages. Mỗi lần push lên main: đưa gh-pages lên bằng main rồi yêu cầu build Pages
# (commit đẩy từ ứng dụng không tự kích hoạt bản build).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  pages: write
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Đẩy main sang gh-pages
        run: git push -f origin HEAD:refs/heads/gh-pages
      - name: Yêu cầu build Pages
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
