<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>Thi thử HSK</title>
<meta name="description" content="Thi thử HSK trên web: tải bộ đề PDF + mp3 lên để thi và tự chấm điểm, hoặc làm đề HSK1 do web tự soạn.">
<meta name="theme-color" content="#b91c1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--panel:#fff;--panel2:#f3eee6;--line:#e6ddd0;--ink:#1f1a17;--muted:#6f655c;--red:#b91c1c;--red2:#fde8e8;--ok:#15803d;--ok2:#e3f5e8;--bad:#b91c1c;--blue:#1d4ed8;--sel:#fff1d6;--selb:#d97706}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15120f;--panel:#1e1a16;--panel2:#26211c;--line:#3a332b;--ink:#f3ede6;--muted:#a89c90;--red:#f87171;--red2:#3a1d1d;--ok:#4ade80;--ok2:#14301f;--bad:#f87171;--blue:#93c5fd;--sel:#3a2c12;--selb:#f59e0b}}
:root[data-theme="dark"]{--bg:#15120f;--panel:#1e1a16;--panel2:#26211c;--line:#3a332b;--ink:#f3ede6;--muted:#a89c90;--red:#f87171;--red2:#3a1d1d;--ok:#4ade80;--ok2:#14301f;--bad:#f87171;--blue:#93c5fd;--sel:#3a2c12;--selb:#f59e0b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Be Vietnam Pro',system-ui,sans-serif}
.zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
header{position:sticky;top:0;z-index:30;background:var(--red);color:#fff}
.bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;margin-right:auto;cursor:pointer;display:flex;align-items:center;gap:8px}.brand span{font-family:'Noto Sans SC';background:#fff;color:var(--red);border-radius:8px;padding:0 7px}
#timer{font:700 20px 'Be Vietnam Pro';font-variant-numeric:tabular-nums;background:#0003;border-radius:10px;padding:3px 12px}
.hbtn{background:#fff;color:var(--red);border:0;border-radius:10px;font:700 14px inherit;font-family:inherit;padding:8px 14px;cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:18px 16px 120px}
h1{font-size:28px;margin:6px 0 4px;letter-spacing:-.02em}h2{font-size:19px;margin:24px 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 16px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;background:var(--panel)}
.drop.over{border-color:var(--red);background:var(--red2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.set h3{margin:0 0 4px;font-size:17px}.set .row{margin-top:10px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.badge.ok{background:var(--ok2);color:var(--ok)}.badge.bad{background:var(--red2);color:var(--bad)}
/* thi đề PDF */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media(max-width:900px){.exam{grid-template-columns:1fr}}
.pages img{width:100%;display:block;border-radius:10px;border:1px solid var(--line);margin-bottom:12px;background:#fff}
.sheet{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto}
@media(max-width:900px){.sheet{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:62vh;border-radius:16px 16px 0 0;z-index:25;transform:translateY(calc(100% - 58px));transition:transform .25s}.sheet.open{transform:none}}
.sheet .handle{display:none}@media(max-width:900px){.sheet .handle{display:flex;justify-content:space-between;align-items:center;font-weight:700;cursor:pointer;padding-bottom:10px}}
.ptitle{font-weight:700;font-size:13px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.qrow{display:flex;align-items:center;gap:6px;padding:3px 0}.qrow b{width:26px;text-align:right;font-variant-numeric:tabular-nums}
.op{min-width:34px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font:700 14px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.op.on{background:var(--sel);border-color:var(--selb);color:var(--ink);box-shadow:inset 0 0 0 1px var(--selb)}
.op.right{background:var(--ok2);border-color:var(--ok);color:var(--ok)}.op.wrong{background:var(--red2);border-color:var(--bad);color:var(--bad)}
audio{width:100%}
.audiobox{position:sticky;top:58px;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
/* đề tự sinh */
.part{margin-top:22px}.part h2{margin:0}.part p{margin:4px 0 10px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.qh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.qn{font-weight:800;color:var(--red)}
.pic{font-size:54px;line-height:1.1}.pics{display:flex;gap:10px;flex-wrap:wrap}
.choice{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;cursor:pointer;font:inherit;color:var(--ink);display:flex;align-items:center;gap:8px;text-align:left}
.choice .L{font-weight:800;color:var(--muted)}.choice.on{background:var(--sel);border-color:var(--selb)}
.choice.right{background:var(--ok2);border-color:var(--ok)}.choice.wrong{background:var(--red2);border-color:var(--bad)}
.choice .big{font-size:40px}
ruby{ruby-position:over}rt{font-size:.62em;color:var(--muted);font-family:'Be Vietnam Pro'}
.play{border:0;background:var(--red);color:#fff;border-radius:99px;padding:6px 12px;font:700 13px inherit;font-family:inherit;cursor:pointer}
.play:disabled{opacity:.5}
.groupbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:6px 0 12px}
.groupbox>div{background:var(--panel2);border-radius:10px;padding:8px;display:flex;gap:10px;align-items:center}.groupbox>div>b{color:var(--red)}
.exp{margin-top:8px;font-size:14px;background:var(--panel2);border-radius:10px;padding:8px 10px}
.tfbtns{display:flex;gap:8px}
/* kết quả */
.score{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch}
.score div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:130px}.score b{display:block;font-size:28px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px}
.tw{overflow-x:auto}
.overlay{position:fixed;inset:0;background:#0007;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}.overlay .card{max-width:520px;width:100%;max-height:85vh;overflow:auto}
.prog{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--red);width:0;transition:width .2s}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}.keygrid label{font-size:13px;display:flex;gap:4px;align-items:center}
.keygrid select{width:52px;padding:3px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.hide{display:none!important}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand" id="home"><span>汉</span> Thi thử HSK</div>
  <div id="timer" class="hide">40:00</div>
  <button class="hbtn hide" id="submitBtn">Nộp bài</button>
</div></header>
<main id="app"></main>

<div class="overlay" id="ov"><div class="card" id="ovc"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="hsk1.js?v=2"></script>
<script src="app.js?v=6"></script>
</body>
</html>
